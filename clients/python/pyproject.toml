[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quiver-client"
version = "0.1.0"
description = "Dependency-free Python client for the Quiver vector database"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Mohamed Anan" }]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Database",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools]
packages = ["quiver_client"]
